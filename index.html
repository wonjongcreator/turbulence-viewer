<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="난류 패키지">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>난류 패키지</title>
<style>
:root{ color-scheme: light dark;
  --bg:#F4F3EF; --card:#FFFFFF; --ink:#14213D; --body:#3D4A5C; --muted:#6A7383; --line:#E2E0D8; --accent:#E8742A; --chip:#F0EEE8; --r:#D7372B; }
@media (prefers-color-scheme: dark){ :root{
  --bg:#0E1626; --card:#16213A; --ink:#EEF2F8; --body:#C9D2DE; --muted:#93A0B3; --line:#26324B; --chip:#1E2A44; --r:#F0574A; } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:max(16px, env(safe-area-inset-top)) 16px 40px}
h1{font-size:24px;margin:8px 2px 4px} .lead{font-size:14px;color:var(--body);margin:0 2px 16px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted)}
label.pick{display:block;text-align:center;background:var(--accent);color:#fff;font-weight:800;font-size:17px;border-radius:12px;padding:16px;cursor:pointer}
label.pick input{display:none}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{font-size:17px;font-weight:800} .item .d{font-size:13px;color:var(--muted);margin-top:2px}
.item a{flex:1;color:inherit;text-decoration:none}
button{font:inherit;font-size:13px;font-weight:700;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:8px 10px}
.msg{font-size:14px;margin-top:10px;line-height:1.5} .err{color:var(--r)}
.hint{font-size:12px;color:var(--muted);line-height:1.6}
.state{font-size:12px;color:var(--muted);margin:6px 2px 0}
</style>
</head>
<body>
<div class="wrap">
  <h1>✈️ 난류 패키지</h1>
  <p class="lead">앱(Streamlit)에서 내려받은 비행 패키지 파일을 불러오면, 인터넷 없이 주의 구간·그래프·지도를 보고 이륙 시각을 바꾸고 알람을 쓸 수 있습니다.</p>
  <div class="card">
    <label class="pick">패키지 불러오기<input type="file" id="file" accept=".html,.htm,text/html"></label>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card">
    <h2>저장된 패키지</h2>
    <div id="list"></div>
  </div>
  <div class="card hint">
    <b style="color:var(--ink)">처음 한 번:</b> 사파리에서 이 주소를 열고 공유 버튼 → "홈 화면에 추가". 그다음부터는 홈 화면 아이콘으로 여세요. 비행기 모드에서도 열립니다.<br>
    <b style="color:var(--ink)">게이트에서:</b> 앱에서 패키지를 내려받아 파일 앱에 저장 → 여기서 "패키지 불러오기".<br>
    불러온 패키지는 이 휴대폰에만 저장되고 어디에도 보내지 않습니다. 교육용이며 실제 운항 판단에 쓸 수 없습니다.
  </div>
  <div class="state" id="state"></div>
</div>
<script>
const KEY = "tbv_list";
const $ = id => document.getElementById(id);
function getList(){ try{ return JSON.parse(localStorage.getItem(KEY) || "[]"); }catch(e){ return []; } }
function setList(l){ localStorage.setItem(KEY, JSON.stringify(l)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function render(){
  const l = getList();
  $("list").innerHTML = l.length ? l.map(p =>
    '<div class="item"><a href="view.html?id=' + encodeURIComponent(p.id) + '"><div class="t">' + esc(p.flight) + ' · ' + esc(p.route) + '</div>' +
    '<div class="d">' + esc(p.date) + ' 게이트 ' + esc(p.gate) + ' · 받은 시각 ' + esc(p.made) + '</div></a>' +
    '<button data-del="' + esc(p.id) + '">지우기</button></div>').join("")
    : '<div class="hint">아직 불러온 패키지가 없습니다.</div>';
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const id = b.dataset.del; setList(getList().filter(p => p.id !== id));
    try{ localStorage.removeItem("tbv_pkg_" + id); }catch(e){} render(); });
}
$("file").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  $("msg").className = "msg"; $("msg").textContent = "읽는 중...";
  try{
    const text = await f.text();
    const m = text.match(/const D = (\{[\s\S]*?\});\n/);
    if (!m) throw new Error("비행 패키지 파일이 아닙니다.");
    const D = JSON.parse(m[1]);
    if (!D || !D.pts || !D.flight) throw new Error("패키지 내용을 읽지 못했습니다.");
    try{ localStorage.setItem("tbv_pkg_" + D.id, m[1]); }
    catch(err){ throw new Error("휴대폰 저장 공간이 부족합니다. 지난 패키지를 지우고 다시 해 보세요."); }
    const l = getList().filter(p => p.id !== D.id);
    l.unshift({id: D.id, flight: D.flight, route: (D.from || "").split(" (")[0] + " → " + (D.to || "").split(" (")[0],
               date: D.date_txt, gate: D.gate, made: D.made});
    for (const old of l.splice(10)) { try{ localStorage.removeItem("tbv_pkg_" + old.id); }catch(err){} }
    setList(l);
    location.href = "view.html?id=" + encodeURIComponent(D.id);
  }catch(err){ $("msg").className = "msg err"; $("msg").textContent = err.message; }
  e.target.value = "";
};
render();
if ("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(() => { $("state").textContent = "오프라인 준비됨"; })
    .catch(() => { $("state").textContent = "오프라인 저장을 켜지 못했습니다 (인터넷이 될 때 다시 열어 보세요)."; });
}
</script>
</body>
</html>
